name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: rqgm toy --output runs/toy
      - run: python skills/rqgm-reproduction/scripts/audit_run.py runs/toy/state.json
      - run: python skills/rqgm-reproduction/scripts/scaffold_experiment.py /tmp/rqgm-adapter
